[workspace]
resolver = "2"
members = [
    "crates/feel-core",
    "crates/feel-config",
    "crates/feel-db",
    "crates/feel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "LGPL-3.0-or-later"
repository = "https://github.com/gaspaluca-oss/feel-frontend"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[profile.release]
# I cabinati hanno hardware vecchio: meglio un binario piu' piccolo e piu' veloce.
opt-level = 3
lto = true
codegen-units = 1
strip = true
